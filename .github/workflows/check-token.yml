name: Check Personal Access Token if still up to date
# Controls when the action will run.
on:
  workflow_dispatch:
  schedule:
    # Automatically run on every day at 07:00
    - cron:  '0 7 * * *'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        secret_name:
          - GH_PAT_UPSTREAM
          - GH_PAT_CROSSREPO
      fail-fast: false  # Continue testing other secrets even if one fails
    steps:
      - name: Check Personal Access Token - ${{ matrix.secret_name }}
        env:
          PAT: ${{ secrets[matrix.secret_name] }}
          SECRET_NAME: ${{ matrix.secret_name }}
        run: |
          echo "Checking GitHub Token ($SECRET_NAME) for expiry and/or access"

          if [ -z "$PAT" ]; then
            echo "Error: Secret $SECRET_NAME is not defined or empty"
            exit 1
          fi

          status="$(curl --silent --output response.json --write-out '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer $PAT" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}")"

          if [ "$status" = "200" ]; then
            echo "Yay! Your personal access token is not expired and has access to this repo"
          else
            echo "Boo! Your personal access token is expired or has no access"
            echo "Failure: HTTP status=$status"
            cat response.json
            exit 1
          fi
